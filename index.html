<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINCE SHUVO // 2GB VAULT MAINFRAME</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #040711;
            --neon-green: #00ff9d;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #9d4edd;
            --terminal-box: #0a1122;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; }
        body {
            background-color: var(--bg-black);
            color: #d1d5db;
            min-height: 100vh;
            background-image: radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px), radial-gradient(rgba(0, 255, 157, 0.05) 1px, var(--bg-black) 1px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            overflow-x: hidden;
        }
        .hidden { display: none !important; }

        /* Login Screen */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            background: rgba(10, 17, 34, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
            text-align: center;
        }
        .login-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #060913; border: 1px solid #1e293b; color: #94a3b8; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .tab-btn.active { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(0,255,157,0.3); }

        .cyber-input {
            width: 100%;
            padding: 13px;
            background: #060913;
            border: 2px solid #1e293b;
            color: var(--neon-green);
            font-size: 14px;
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .cyber-input:focus { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(0, 255, 157, 0.3); }
        .btn-hack {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
            transition: 0.2s;
        }

        /* Top HUD Header */
        header {
            background: rgba(8, 13, 23, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--neon-cyan);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.6);
        }
        .hud-profile-box { display: flex; align-items: center; gap: 8px; }
        .avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            object-fit: cover;
            box-shadow: 0 0 10px var(--neon-green);
            cursor: pointer;
        }
        .btn-settings {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }
        .btn-logout {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        /* Container & Actions Deck */
        .container { max-width: 1200px; margin: 0 auto; padding: 25px 15px 80px; }
        .actions-deck {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            background: var(--terminal-box);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            margin-bottom: 25px;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }
        .btn-upload-cyber { background: var(--neon-green); color: #030712; box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }
        .btn-folder-cyber { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }

        /* Progress Bar */
        .progress-card {
            background: #060913;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: center;
        }
        .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--neon-green); }
        .progress-bar-wrap { width: 100%; height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan)); transition: width 0.15s ease; box-shadow: 0 0 10px var(--neon-green); }

        /* Breadcrumb */
        .cyber-breadcrumb {
            background: #060913;
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid var(--neon-green);
            font-size: 13px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cyber-breadcrumb span { cursor: pointer; color: var(--neon-cyan); }
        .cyber-breadcrumb .active-path { color: #fff; font-weight: 700; }

        .section-header {
            font-size: 14px;
            font-weight: 800;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 30px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-header::after { content: ""; flex: 1; height: 1px; background: rgba(0,255,157,0.2); }

        /* Media Grids */
        .folders-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
        .folder-node {
            background: linear-gradient(145deg, #0d1527, #070a14);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .folder-node:hover { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 157, 0.3); }

        .files-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
        .cyber-card {
            background: #090e1c;
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .cyber-card:hover { border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }
        .card-preview { height: 160px; background: #03050a; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .card-preview img, .card-preview video { width: 100%; height: 100%; object-fit: cover; }
        .play-indicator { position: absolute; width: 44px; height: 44px; background: rgba(0,0,0,0.75); border: 2px solid var(--neon-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--neon-green); font-size: 16px; }
        .card-footer { padding: 12px; background: #0b1224; display: flex; justify-content: space-between; align-items: center; }
        .file-title { font-size: 11px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 110px; }
        
        .btn-menu-dot {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--neon-cyan);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        /* Modals */
        .cyber-modal { position: fixed; inset: 0; background: rgba(3, 5, 10, 0.95); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-body { max-width: 95%; max-height: 85vh; border: 2px solid var(--neon-green); border-radius: 12px; overflow: hidden; }
        .modal-body img, .modal-body video { max-width: 100%; max-height: 80vh; }
        
        .action-sheet-card {
            background: rgba(10, 17, 34, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
        }
        .action-sheet-title { font-size: 13px; color: var(--neon-cyan); font-weight: 700; margin-bottom: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sheet-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #060913; border: 1px solid #1e293b; color: #fff; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-decoration: none; }
        .sheet-btn:hover { border-color: var(--neon-green); color: var(--neon-green); }
        .sheet-btn.danger { color: var(--neon-pink); border-color: rgba(255, 0, 127, 0.3); }

        .settings-card {
            background: rgba(10, 17, 34, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
            max-height: 90vh;
            overflow-y: auto;
        }
        .settings-card h2 { font-size: 17px; color: var(--neon-cyan); margin-bottom: 20px; }
        .badge-token-status { font-size: 11px; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- ১. লগইন ভিউ -->
    <div id="loginView" class="login-wrap">
        <div class="login-card">
            <h1>PRINCE SHUVO</h1>
            <p style="color:var(--neon-green); font-size:12px; margin-bottom:20px;">[2GB LIFETIME CLOUD VAULT]</p>
            <form onsubmit="handleSimpleLogin(event)">
                <input type="text" id="vaultUser" class="cyber-input" placeholder="[ইউজারনেম দিন...]" required autocomplete="off">
                <button type="submit" class="btn-hack">> ড্রাইভে প্রবেশ করুন_</button>
            </form>
        </div>
    </div>

    <!-- ২. ড্রাইভ ড্যাশবোর্ড -->
    <div id="dashView" class="hidden">
        <header>
            <div class="logo-title">PRINCE SHUVO // 2GB</div>
            <div class="hud-profile-box">
                <img id="userAvatar" class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=shuvo" onclick="openSettingsModal()" title="সেটিংস">
                <span class="badge-hud" id="hudUser">[AGENT]</span>
                <button class="btn-settings" onclick="openSettingsModal()">⚙️</button>
                <button class="btn-logout" onclick="logout()">[LOGOUT]</button>
            </div>
        </header>

        <main class="container">
            <div class="actions-deck">
                <button class="btn-action btn-upload-cyber" onclick="triggerUpload()">
                    ⚡ ২ জিবি ফাইল আপলোড
                </button>
                <input type="file" id="filePicker" multiple accept="image/*,video/*" class="hidden" onchange="uploadFilesToGitHub(this)">
                
                <button class="btn-action btn-folder-cyber" onclick="promptNewFolder()">
                    📁 + নতুন ফোল্ডার
                </button>
            </div>

            <!-- প্রগ্রেস বার -->
            <div id="progressBox" class="progress-card hidden">
                <div class="progress-header">
                    <span id="progressFileText">> আপলোড হচ্ছে...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-wrap">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <div class="cyber-breadcrumb" id="breadcrumbNav"></div>

            <div id="folderSec" class="hidden">
                <div class="section-header">// ফোল্ডারসমূহ</div>
                <div class="folders-matrix" id="foldersGrid"></div>
            </div>

            <div class="section-header">// সংরক্ষিত ফাইল ও ভিডিও (2GB ENGINE)</div>
            <div class="files-matrix" id="filesGrid"></div>
        </main>
    </div>

    <!-- ৩. ৩-ডট (⋮) অ্যাকশন মেনু মোডাল -->
    <div id="actionModal" class="cyber-modal hidden" onclick="closeActionModal()">
        <div class="action-sheet-card" onclick="event.stopPropagation()">
            <div class="action-sheet-title" id="actionTargetTitle">// OPTION_MENU</div>
            <button class="sheet-btn" onclick="executeRename()">✏️ নাম পরিবর্তন (Rename)</button>
            <a id="actionDownloadBtn" class="sheet-btn" target="_blank" download>⬇️ ডাউনলোড (Download)</a>
            <button class="sheet-btn danger" onclick="executeDelete()">🗑️ মুছে ফেলুন (Delete)</button>
            <button class="sheet-btn" style="border-color:#475569; color:#94a3b8; margin-top:10px;" onclick="closeActionModal()">[✕ বন্ধ করুন]</button>
        </div>
    </div>

    <!-- ৪. প্রোফাইল ও ২ জিবি ক্লাউড কি সেটিংস -->
    <div id="settingsModal" class="cyber-modal hidden" onclick="closeSettingsModal()">
        <div class="settings-card" onclick="event.stopPropagation()">
            <h2>⚙️ ক্লাউড ও প্রোফাইল সেটিংস</h2>
            
            <div style="background:#060913; padding:15px; border-radius:10px; border:1px solid var(--neon-cyan); margin-bottom:20px; text-align:left;">
                <div style="font-size:12px; font-weight:800; color:var(--neon-green); margin-bottom:6px;">⚡ GITHUB 2GB CLOUD TOKEN:</div>
                <input type="password" id="ghTokenInput" class="cyber-input" style="margin-bottom:8px; font-size:12px;" placeholder="ghp_... টোকেন পেস্ট করুন">
                <button class="btn-hack" style="padding:8px; font-size:12px;" onclick="saveGitHubToken()">টোকেন সেভ করুন</button>
                <div id="tokenStatus" style="margin-top:8px; font-size:11px;"></div>
            </div>

            <div style="text-align:left; font-size:12px; color:var(--neon-cyan); margin-bottom:5px;">ইউজারনেম পরিবর্তন:</div>
            <input type="text" id="newUsernameInput" class="cyber-input" placeholder="নতুন ইউজারনেম...">
            <button class="btn-hack" style="padding:8px; margin-bottom:15px;" onclick="updateUsername()">ইউজারনেম সেভ</button>

            <button class="btn-settings" style="width:100%;" onclick="closeSettingsModal()">বন্ধ করুন [✕]</button>
        </div>
    </div>

    <!-- ৫. মিডিয়া লাইটবক্স -->
    <div id="previewModal" class="cyber-modal hidden" onclick="closePreview()">
        <button style="position:absolute; top:20px; right:25px; font-size:28px; color:var(--neon-pink); background:none; border:none; cursor:pointer;" onclick="closePreview()">✕</button>
        <div class="modal-body" id="modalTarget" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        const REPO_OWNER = 'princeshuvo089';
        const REPO_NAME = 'prince-shuvo-drive';
        const RELEASE_TAG = 'vault';

        let currentUser = localStorage.getItem('prince_vault_user') || null;
        let currentPath = '';
        let activeItem = null;
        let cachedReleaseId = null;

        // স্মার্ট ব্যাক বাটন
        window.addEventListener('popstate', (e) => {
            const openModal = document.querySelector('.cyber-modal:not(.hidden)');
            if (openModal) {
                openModal.classList.add('hidden');
                const modalTarget = document.getElementById('modalTarget');
                if (modalTarget) modalTarget.innerHTML = '';
                return;
            }
            if (e.state && e.state.path !== undefined) {
                loadContent(e.state.path);
            } else if (currentPath !== '') {
                const parts = currentPath.split('/');
                parts.pop();
                loadContent(parts.join('/'));
            }
        });

        function navigateTo(path) {
            if (path !== currentPath) {
                history.pushState({ path }, '', path ? `#${encodeURIComponent(path)}` : '#');
            }
            loadContent(path);
        }

        function initApp() {
            if (currentUser) {
                showDashboard(currentUser);
            }
        }
        initApp();

        function handleSimpleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('vaultUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            if (!u) return;
            currentUser = u;
            localStorage.setItem('prince_vault_user', u);
            showDashboard(u);
        }

        function showDashboard(username) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashView').classList.remove('hidden');
            document.getElementById('hudUser').textContent = `[AGENT: ${username.toUpperCase()}]`;
            document.getElementById('newUsernameInput').value = username;
            
            const savedToken = localStorage.getItem('gh_storage_token');
            if (savedToken) document.getElementById('ghTokenInput').value = savedToken;

            const initialHash = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
            loadContent(initialHash || '');
        }

        function saveGitHubToken() {
            const token = document.getElementById('ghTokenInput').value.trim();
            const status = document.getElementById('tokenStatus');
            if (!token) return;
            localStorage.setItem('gh_storage_token', token);
            status.style.color = 'var(--neon-green)';
            status.textContent = '✔ ২ জিবি ক্লাউড টোকেন সক্রিয় হয়েছে!';
        }

        function triggerUpload() {
            const token = localStorage.getItem('gh_storage_token');
            if (!token) {
                alert('বড় ফাইল আপলোড করতে ⚙️ সেটিংসে গিয়ে আপনার GitHub Token-টি একবার সেভ করে নিন!');
                openSettingsModal();
                return;
            }
            document.getElementById('filePicker').click();
        }

        // রিলিজ আইডি আনা বা তৈরি করা
        async function getOrCreateReleaseId(token) {
            if (cachedReleaseId) return cachedReleaseId;
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${RELEASE_TAG}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    cachedReleaseId = data.id;
                    return cachedReleaseId;
                }
                // না থাকলে তৈরি করা
                const createRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tag_name: RELEASE_TAG,
                        name: 'PRINCE SHUVO 2GB PERMANENT CLOUD',
                        body: 'Secure 2GB Multi-Media Storage',
                        draft: false,
                        prerelease: false
                    })
                });
                const createData = await createRes.json();
                cachedReleaseId = createData.id;
                return cachedReleaseId;
            } catch(e) {
                return null;
            }
        }

        // আপলোড ইঞ্জিন (2GB XHR Progress)
        function uploadToGitHub(file, filename, releaseId, token, onProgress) {
            return new Promise((resolve, reject) => {
                const encodedName = encodeURIComponent(filename);
                const url = `https://uploads.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/${releaseId}/assets?name=${encodedName}`;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', url);
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        onProgress(percent);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) resolve();
                    else reject(new Error(`Upload status ${xhr.status}`));
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(file);
            });
        }

        async function uploadFilesToGitHub(input) {
            if (!input.files.length) return;
            const token = localStorage.getItem('gh_storage_token');
            if (!token) return;

            const progressBox = document.getElementById('progressBox');
            const progressFileText = document.getElementById('progressFileText');
            const progressPercent = document.getElementById('progressPercent');
            const progressFill = document.getElementById('progressFill');

            progressBox.classList.remove('hidden');

            const releaseId = await getOrCreateReleaseId(token);
            if (!releaseId) {
                alert('টোকেনটি সঠিক নয় অথবা ক্লাউড রেডি হতে পারেনি!');
                progressBox.classList.add('hidden');
                return;
            }

            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                progressFileText.textContent = `> আপলোড হচ্ছে: ${file.name}`;
                progressPercent.textContent = '0%';
                progressFill.style.width = '0%';

                const prefix = currentPath ? `${currentUser}__${currentPath.replace(/\//g, '__')}__` : `${currentUser}__`;
                const cleanName = `${prefix}${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;

                try {
                    await uploadToGitHub(file, cleanName, releaseId, token, (percent) => {
                        progressPercent.textContent = `${percent}%`;
                        progressFill.style.width = `${percent}%`;
                    });
                } catch (err) {
                    alert('আপলোডে সমস্যা হয়েছে: ' + err.message);
                }
            }

            progressPercent.textContent = '100%';
            progressFill.style.width = '100%';
            progressFileText.textContent = '> [UPLOAD COMPLETE 100%]';
            
            setTimeout(() => {
                progressBox.classList.add('hidden');
            }, 1000);

            input.value = '';
            loadContent(currentPath);
        }

        // কনটেন্ট লোড
        async function loadContent(path = '') {
            currentPath = path;
            renderBreadcrumb(path);

            const token = localStorage.getItem('gh_storage_token');
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${RELEASE_TAG}`, { headers });
            if (!res.ok) {
                renderEmpty();
                return;
            }
            const data = await res.json();
            const assets = data.assets || [];

            const userPrefix = `${currentUser}__`;
            const currentFolderPrefix = path ? `${currentUser}__${path.replace(/\//g, '__')}__` : userPrefix;

            const foldersSet = new Set();
            const files = [];

            // লোকাল স্টোরেজে তৈরি ফোল্ডার যোগ করা
            const savedFolders = JSON.parse(localStorage.getItem(`folders_${currentUser}`) || '[]');
            savedFolders.forEach(f => {
                if (path === '') {
                    if (!f.includes('/')) foldersSet.add(f);
                } else if (f.startsWith(path + '/') && f.split('/').length === path.split('/').length + 1) {
                    foldersSet.add(f.split('/').pop());
                }
            });

            assets.forEach(asset => {
                if (!asset.name.startsWith(userPrefix)) return;

                if (path === '') {
                    const withoutUser = asset.name.substring(userPrefix.length);
                    if (withoutUser.includes('__')) {
                        const folderName = withoutUser.split('__')[0];
                        foldersSet.add(folderName);
                    } else {
                        files.push(makeFileObj(asset, withoutUser));
                    }
                } else {
                    if (asset.name.startsWith(currentFolderPrefix)) {
                        const rest = asset.name.substring(currentFolderPrefix.length);
                        if (rest.includes('__')) {
                            const subFolder = rest.split('__')[0];
                            foldersSet.add(subFolder);
                        } else {
                            files.push(makeFileObj(asset, rest));
                        }
                    }
                }
            });

            // ফোল্ডার রেন্ডার
            const folderSec = document.getElementById('folderSec');
            const foldersGrid = document.getElementById('foldersGrid');
            foldersGrid.innerHTML = '';
            if (foldersSet.size > 0) {
                folderSec.classList.remove('hidden');
                foldersSet.forEach(folderName => {
                    const fullFolderPath = path ? `${path}/${folderName}` : folderName;
                    const node = document.createElement('div');
                    node.className = 'folder-node';
                    node.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px; overflow:hidden; flex:1;" onclick="navigateTo('${fullFolderPath}')">
                            <span style="color:var(--neon-cyan)">📁</span>
                            <span style="font-size:12px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${folderName}</span>
                        </div>
                    `;
                    foldersGrid.appendChild(node);
                });
            } else {
                folderSec.classList.add('hidden');
            }

            // ফাইল রেন্ডার
            const filesGrid = document.getElementById('filesGrid');
            filesGrid.innerHTML = '';
            if (files.length > 0) {
                files.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'cyber-card';

                    let mediaHtml = '<div style="font-size:36px;">📄</div>';
                    if (f.type === 'image') mediaHtml = `<img src="${f.url}" loading="lazy">`;
                    if (f.type === 'video') mediaHtml = `<video src="${f.url}#t=0.5"></video><div class="play-indicator">▶</div>`;

                    card.innerHTML = `
                        <div class="card-preview" onclick="openPreview('${f.url}', '${f.type}')">${mediaHtml}</div>
                        <div class="card-footer">
                            <div class="file-title" title="${f.displayName}">${f.displayName}</div>
                            <button class="btn-menu-dot" onclick="event.stopPropagation(); openActionModal('${f.displayName}', '${f.id}', '${f.url}')">⋮</button>
                        </div>
                    `;
                    filesGrid.appendChild(card);
                });
            } else {
                filesGrid.innerHTML = '<p style="color:#64748b; font-size:12px; grid-column: 1/-1; text-align:center; padding:30px 0;">কোনো ফাইল আপলোড করা নেই।</p>';
            }
        }

        function makeFileObj(asset, rawName) {
            const ext = asset.name.split('.').pop().toLowerCase();
            let type = 'other';
            if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) type = 'image';
            if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) type = 'video';
            const cleanDisplay = rawName.replace(/^[0-9]+_/, '');
            return {
                id: asset.id,
                name: asset.name,
                displayName: cleanDisplay,
                url: asset.browser_download_url,
                type
            };
        }

        function renderEmpty() {
            document.getElementById('foldersGrid').innerHTML = '';
            document.getElementById('filesGrid').innerHTML = '<p style="color:#64748b; font-size:12px; grid-column: 1/-1; text-align:center; padding:30px 0;">কোনো ফাইল নেই। ২ জিবি ফাইল আপলোড বাটনে চাপ দিন।</p>';
        }

        function renderBreadcrumb(path) {
            const nav = document.getElementById('breadcrumbNav');
            nav.innerHTML = '<span onclick="navigateTo(\'\')">🏠 ROOT_VAULT</span>';
            if (!path) return;

            const parts = path.split('/');
            let accum = '';
            parts.forEach((p, idx) => {
                accum += (idx === 0 ? '' : '/') + p;
                const isLast = idx === parts.length - 1;
                const currentAccum = accum;
                nav.innerHTML += ` <span style="color:#475569">/</span> <span class="${isLast ? 'active-path' : ''}" onclick="navigateTo('${currentAccum}')">${p}</span>`;
            });
        }

        function promptNewFolder() {
            const name = prompt('নতুন ফোল্ডারের নাম দিন:');
            if (!name) return;
            const clean = name.trim().replace(/[^a-zA-Z0-9 _-]/g, '');
            const targetPath = currentPath ? `${currentPath}/${clean}` : clean;

            const savedFolders = JSON.parse(localStorage.getItem(`folders_${currentUser}`) || '[]');
            if (!savedFolders.includes(targetPath)) {
                savedFolders.push(targetPath);
                localStorage.setItem(`folders_${currentUser}`, JSON.stringify(savedFolders));
            }
            loadContent(currentPath);
        }

        // ৩-ডট মেনু
        function openActionModal(title, assetId, url) {
            activeItem = { title, assetId, url };
            document.getElementById('actionTargetTitle').textContent = `// ${title}`;
            document.getElementById('actionDownloadBtn').href = url;
            document.getElementById('actionModal').classList.remove('hidden');
            history.pushState({ modalOpen: true }, '');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.add('hidden');
            activeItem = null;
        }

        async function executeRename() {
            if (!activeItem) return;
            const token = localStorage.getItem('gh_storage_token');
            if (!token) return alert('টোকেন পাওয়া যায়নি!');

            const newNameInput = prompt('নতুন ফাইলের নাম দিন:', activeItem.title);
            if (!newNameInput || newNameInput.trim() === activeItem.title) return;

            const prefix = currentPath ? `${currentUser}__${currentPath.replace(/\//g, '__')}__` : `${currentUser}__`;
            const cleanName = `${prefix}${Date.now()}_${newNameInput.trim().replace(/[^a-zA-Z0-9.-]/g, '_')}`;

            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/assets/${activeItem.assetId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: cleanName })
            });

            if (res.ok) {
                closeActionModal();
                loadContent(currentPath);
            } else {
                alert('নাম পরিবর্তনে সমস্যা হয়েছে!');
            }
        }

        async function executeDelete() {
            if (!activeItem) return;
            const token = localStorage.getItem('gh_storage_token');
            if (!token) return alert('টোকেন পাওয়া যায়নি!');
            if (!confirm('সত্যিই এই ফাইলটি গিটহাব ক্লাউড থেকে মুছে ফেলতে চান?')) return;

            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/assets/${activeItem.assetId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                closeActionModal();
                loadContent(currentPath);
            } else {
                alert('ফাইল মুছতে সমস্যা হয়েছে!');
            }
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
            history.pushState({ modalOpen: true }, '');
        }
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function updateUsername() {
            const u = document.getElementById('newUsernameInput').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            if (!u) return;
            currentUser = u;
            localStorage.setItem('prince_vault_user', u);
            document.getElementById('hudUser').textContent = `[AGENT: ${u.toUpperCase()}]`;
            alert('ইউজারনেম আপডেট হয়েছে!');
            closeSettingsModal();
            loadContent('');
        }

        function openPreview(url, type) {
            const modal = document.getElementById('previewModal');
            const target = document.getElementById('modalTarget');
            target.innerHTML = '';
            if (type === 'image') target.innerHTML = `<img src="${url}">`;
            else if (type === 'video') target.innerHTML = `<video src="${url}" controls autoplay></video>`;
            else { window.open(url, '_blank'); return; }
            modal.classList.remove('hidden');
            history.pushState({ modalOpen: true }, '');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('modalTarget').innerHTML = '';
        }

        function logout() {
            localStorage.removeItem('prince_vault_user');
            location.reload();
        }
    </script>
</body>
</html>
