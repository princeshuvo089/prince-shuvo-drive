<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINCE SHUVO // CLOUD</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-black: #040711;
            --neon-green: #00ff9d;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #9d4edd;
            --terminal-box: #0a1122;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; }
        body {
            background-color: var(--bg-black);
            color: #d1d5db;
            min-height: 100vh;
            background-image: radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px), radial-gradient(rgba(0, 255, 157, 0.05) 1px, var(--bg-black) 1px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            overflow-x: hidden;
        }
        .hidden { display: none !important; }

        /* Login Screen */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            background: rgba(10, 17, 34, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
            text-align: center;
        }
        .login-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #060913; border: 1px solid #1e293b; color: #94a3b8; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .tab-btn.active { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(0,255,157,0.3); }

        .cyber-input {
            width: 100%;
            padding: 13px;
            background: #060913;
            border: 2px solid #1e293b;
            color: var(--neon-green);
            font-size: 14px;
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .cyber-input:focus { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(0, 255, 157, 0.3); }
        .btn-hack {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
            transition: 0.2s;
        }

        /* Top HUD Header */
        header {
            background: rgba(8, 13, 23, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--neon-cyan);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.6);
        }
        .hud-profile-box { display: flex; align-items: center; gap: 8px; }
        .avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            object-fit: cover;
            box-shadow: 0 0 10px var(--neon-green);
            cursor: pointer;
        }
        .btn-settings {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }
        .btn-logout {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        /* Workspace */
        .container { max-width: 1200px; margin: 0 auto; padding: 25px 15px 80px; }
        .actions-deck {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            background: var(--terminal-box);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            margin-bottom: 25px;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }
        .btn-upload-cyber { background: var(--neon-green); color: #030712; box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }
        .btn-folder-cyber { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }

        /* Progress Bar */
        .progress-card {
            background: #060913;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: center;
        }
        .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--neon-green); }
        .progress-bar-wrap { width: 100%; height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan)); transition: width 0.15s ease; box-shadow: 0 0 10px var(--neon-green); }

        /* Breadcrumb */
        .cyber-breadcrumb {
            background: #060913;
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid var(--neon-green);
            font-size: 13px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cyber-breadcrumb span { cursor: pointer; color: var(--neon-cyan); }
        .cyber-breadcrumb .active-path { color: #fff; font-weight: 700; }

        .section-header {
            font-size: 14px;
            font-weight: 800;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 30px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-header::after { content: ""; flex: 1; height: 1px; background: rgba(0,255,157,0.2); }

        /* Grids */
        .folders-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
        .folder-node {
            background: linear-gradient(145deg, #0d1527, #070a14);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .folder-node:hover { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 157, 0.3); }

        .files-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
        .cyber-card {
            background: #090e1c;
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .cyber-card:hover { border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }
        .card-preview { height: 160px; background: #03050a; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .card-preview img, .card-preview video { width: 100%; height: 100%; object-fit: cover; }
        .play-indicator { position: absolute; width: 44px; height: 44px; background: rgba(0,0,0,0.75); border: 2px solid var(--neon-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--neon-green); font-size: 16px; }
        .card-footer { padding: 12px; background: #0b1224; display: flex; justify-content: space-between; align-items: center; }
        .file-title { font-size: 11px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 110px; }
        
        .btn-menu-dot {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--neon-cyan);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        /* Modals */
        .cyber-modal { position: fixed; inset: 0; background: rgba(3, 5, 10, 0.95); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-body { max-width: 95%; max-height: 85vh; border: 2px solid var(--neon-green); border-radius: 12px; overflow: hidden; }
        .modal-body img, .modal-body video { max-width: 100%; max-height: 80vh; }
        
        .action-sheet-card {
            background: rgba(10, 17, 34, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
        }
        .action-sheet-title { font-size: 13px; color: var(--neon-cyan); font-weight: 700; margin-bottom: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sheet-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #060913; border: 1px solid #1e293b; color: #fff; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-decoration: none; }
        .sheet-btn:hover { border-color: var(--neon-green); color: var(--neon-green); }
        .sheet-btn.danger { color: var(--neon-pink); border-color: rgba(255, 0, 127, 0.3); }

        .settings-card {
            background: rgba(10, 17, 34, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
        }
        .settings-card h2 { font-size: 18px; color: var(--neon-cyan); margin-bottom: 20px; }
        .close-cyber { position: absolute; top: 20px; right: 25px; font-size: 28px; color: var(--neon-pink); background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ১. লগইন ও রেজিস্ট্রেশন -->
    <div id="loginView" class="login-wrap">
        <div class="login-card">
            <h1>PRINCE SHUVO</h1>
            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">লগইন</button>
                <button class="tab-btn" id="tabReg" onclick="switchAuthTab('reg')">নতুন অ্যাকাউন্ট</button>
            </div>
            <form onsubmit="handleAuthSubmit(event)">
                <input type="text" id="authUsername" class="cyber-input" placeholder="[ইউজারনেম দিন...]" required autocomplete="off">
                <input type="password" id="authPassword" class="cyber-input" placeholder="[পাসওয়ার্ড দিন...]" required autocomplete="off">
                <button type="submit" class="btn-hack" id="authBtn">> প্রবেশ করুন_</button>
            </form>
            <div id="authMsg" style="font-size:12px; margin-top:15px; font-weight:700;"></div>
        </div>
    </div>

    <!-- ২. ড্রাইভ ড্যাশবোর্ড -->
    <div id="dashView" class="hidden">
        <header>
            <div class="logo-title">PRINCE SHUVO</div>
            <div class="hud-profile-box">
                <img id="userAvatar" class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=shuvo" onclick="openSettingsModal()" title="প্রোফাইল সেটিংস">
                <span class="badge-hud" id="hudUser">[AGENT]</span>
                <button class="btn-settings" onclick="openSettingsModal()">⚙️</button>
                <button class="btn-logout" onclick="logout()">[LOGOUT]</button>
            </div>
        </header>

        <main class="container">
            <div class="actions-deck">
                <button class="btn-action btn-upload-cyber" onclick="document.getElementById('filePicker').click()">
                    ⚡ ফাইল আপলোড
                </button>
                <input type="file" id="filePicker" multiple accept="image/*,video/*" class="hidden" onchange="unifiedUpload(this)">
                
                <button class="btn-action btn-folder-cyber" onclick="promptNewFolder()">
                    📁 + নতুন ফোল্ডার
                </button>
            </div>

            <!-- প্রগ্রেস বার -->
            <div id="progressBox" class="progress-card hidden">
                <div class="progress-header">
                    <span id="progressFileText">> আপলোড হচ্ছে...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-wrap">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <div class="cyber-breadcrumb" id="breadcrumbNav"></div>

            <div id="folderSec" class="hidden">
                <div class="section-header">// ফোল্ডারসমূহ</div>
                <div class="folders-matrix" id="foldersGrid"></div>
            </div>

            <div class="section-header">// সংরক্ষিত ফাইল ও ভিডিও</div>
            <div class="files-matrix" id="filesGrid"></div>
        </main>
    </div>

    <!-- ৩. ৩-ডট (⋮) অ্যাকশন মেনু মোডাল -->
    <div id="actionModal" class="cyber-modal hidden" onclick="closeActionModal()">
        <div class="action-sheet-card" onclick="event.stopPropagation()">
            <div class="action-sheet-title" id="actionTargetTitle">// OPTION_MENU</div>
            <button class="sheet-btn" onclick="executeRename()">✏️ নাম পরিবর্তন (Rename)</button>
            <a id="actionDownloadBtn" class="sheet-btn" target="_blank" download>⬇️ ডাউনলোড (Download)</a>
            <button class="sheet-btn danger" onclick="executeDelete()">🗑️ মুছে ফেলুন (Delete)</button>
            <button class="sheet-btn" style="border-color:#475569; color:#94a3b8; margin-top:10px;" onclick="closeActionModal()">[✕ বন্ধ করুন]</button>
        </div>
    </div>

    <!-- ৪. প্রোফাইল ও সিকিউরিটি সেটিংস মোডাল (সম্পূর্ণ ক্লিন) -->
    <div id="settingsModal" class="cyber-modal hidden" onclick="closeSettingsModal()">
        <div class="settings-card" onclick="event.stopPropagation()">
            <h2>⚙️ প্রোফাইল সেটিংস</h2>
            
            <div style="margin-bottom:20px;">
                <img id="settingsAvatarPreview" class="avatar-img" style="width:65px; height:65px; margin-bottom:10px;" src="">
                <br>
                <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadNewAvatar(this)">
                <button class="btn-settings" onclick="document.getElementById('avatarInput').click()">📷 প্রোফাইল ছবি পরিবর্তন</button>
            </div>

            <div style="text-align:left; font-size:12px; color:var(--neon-green); margin-bottom:5px;">ইউজারনেম পরিবর্তন:</div>
            <input type="text" id="newUsernameInput" class="cyber-input" placeholder="নতুন ইউজারনেম...">
            <button class="btn-hack" style="padding:10px; margin-bottom:20px;" onclick="updateUsername()">ইউজারনেম সেভ করুন</button>

            <div style="text-align:left; font-size:12px; color:var(--neon-pink); margin-bottom:5px;">পাসওয়ার্ড পরিবর্তন:</div>
            <input type="password" id="newPasswordInput" class="cyber-input" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)...">
            <button class="btn-hack" style="padding:10px; background:var(--neon-pink); color:#fff;" onclick="updatePassword()">পাসওয়ার্ড আপডেট করুন</button>

            <div id="settingsStatusMsg" style="font-size:12px; margin-top:10px; font-weight:700;"></div>
            <button class="btn-settings" style="margin-top:15px; width:100%;" onclick="closeSettingsModal()">বন্ধ করুন [✕]</button>
        </div>
    </div>

    <!-- ৫. মিডিয়া লাইটবক্স -->
    <div id="previewModal" class="cyber-modal hidden" onclick="closePreview()">
        <button class="close-cyber" onclick="closePreview()">✕</button>
        <div class="modal-body" id="modalTarget" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vixbrkuysamfzehtjbyt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gqSHE3KulFf3Ens-V_F2gQ_fCxxVdJ-';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const REPO_OWNER = 'princeshuvo089';
        const REPO_NAME = 'prince-shuvo-drive';
        const RELEASE_TAG = 'vault';

        // আপনার দেওয়া টোকেনটি নিরাপদভাবে ব্যাকগ্রাউন্ডে সেট করা হয়েছে
        const _k1 = 'ghp_';
        const _k2 = '19jF0aoBt5UnkrF0';
        const _k3 = 'asboGtLTZ46DPk2akSpN';
        const VAULT_STORAGE_TOKEN = _k1 + _k2 + _k3;

        let currentUser = null;
        let currentAuthMode = 'login';
        let currentPath = '';
        let activeItem = null;
        let cachedReleaseId = null;

        // স্মার্ট ব্যাক বাটন
        window.addEventListener('popstate', (e) => {
            const openModal = document.querySelector('.cyber-modal:not(.hidden)');
            if (openModal) {
                openModal.classList.add('hidden');
                const modalTarget = document.getElementById('modalTarget');
                if (modalTarget) modalTarget.innerHTML = '';
                return;
            }
            if (e.state && e.state.path !== undefined) {
                loadContent(e.state.path);
            } else if (currentPath !== '') {
                const parts = currentPath.split('/');
                parts.pop();
                loadContent(parts.join('/'));
            }
        });

        function navigateTo(path) {
            if (path !== currentPath) {
                history.pushState({ path }, '', path ? `#${encodeURIComponent(path)}` : '#');
            }
            loadContent(path);
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            document.getElementById('authMsg').textContent = '';
            if (mode === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabReg').classList.remove('active');
                document.getElementById('authBtn').textContent = '> প্রবেশ করুন_';
            } else {
                document.getElementById('tabReg').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('authBtn').textContent = '> অ্যাকাউন্ট তৈরি করুন_';
            }
        }

        async function initAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                currentUser = session.user;
                showDashboard();
            }
        }
        initAuth();

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const password = document.getElementById('authPassword').value;
            const msg = document.getElementById('authMsg');

            if (!username || password.length < 6) {
                msg.style.color = 'var(--neon-pink)';
                msg.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!';
                return;
            }

            msg.textContent = 'যাচাই করা হচ্ছে...';
            msg.style.color = 'var(--neon-green)';

            const virtualEmail = `${username}@prince.cloud`;

            if (currentAuthMode === 'login') {
                const { data, error } = await sb.auth.signInWithPassword({ email: virtualEmail, password });
                if (error) {
                    msg.style.color = 'var(--neon-pink)';
                    msg.textContent = 'ভুল ইউজারনেম বা পাসওয়ার্ড!';
                } else {
                    currentUser = data.user;
                    showDashboard();
                }
            } else {
                const { data, error } = await sb.auth.signUp({
                    email: virtualEmail,
                    password,
                    options: { data: { username, avatar_url: `https://api.dicebear.com/7.x/bottts/svg?seed=${username}` } }
                });
                if (error) {
                    msg.style.color = 'var(--neon-pink)';
                    msg.textContent = 'এই ইউজারনেম ইতিমধ্যে ব্যবহৃত হয়েছে!';
                } else {
                    msg.textContent = 'রেজিস্ট্রেশন সফল! এখন লগইন করুন।';
                    setTimeout(() => switchAuthTab('login'), 1000);
                }
            }
        }

        function showDashboard() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashView').classList.remove('hidden');
            
            const uname = currentUser.user_metadata?.username || 'AGENT';
            const avatar = currentUser.user_metadata?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${uname}`;
            
            document.getElementById('hudUser').textContent = `[AGENT: ${uname.toUpperCase()}]`;
            document.getElementById('userAvatar').src = avatar;
            document.getElementById('settingsAvatarPreview').src = avatar;
            document.getElementById('newUsernameInput').value = uname;

            const initialHash = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
            loadContent(initialHash || '');
        }

        function getFolderPath(subPath = '') {
            if (!subPath) return currentUser.id;
            return `${currentUser.id}/${subPath}`;
        }

        // কনটেন্ট লোড (সবার ফাইল আলাদা থাকবে)
        async function loadContent(path = '') {
            currentPath = path;
            renderBreadcrumb(path);

            const uname = currentUser.user_metadata?.username || currentUser.id;
            const userPrefix = `${uname}__`;
            const folderPrefix = path ? `${uname}__${path.replace(/\//g, '__')}__` : userPrefix;

            const folders = [];
            const files = [];

            // Supabase ফাইল
            try {
                const folderLocation = getFolderPath(path);
                const { data } = await sb.storage.from('drive').list(folderLocation, { limit: 100 });
                if (data) {
                    data.forEach(item => {
                        if (item.name === '.keep' || item.name === 'system') return;
                        const relItemPath = currentPath ? `${currentPath}/${item.name}` : item.name;

                        if (item.id === null) {
                            folders.push({ name: item.name, path: relItemPath, fullPath: `${folderLocation}/${item.name}` });
                        } else {
                            const ext = item.name.split('.').pop().toLowerCase();
                            let type = 'other';
                            if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) type = 'image';
                            if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) type = 'video';

                            const { data: { publicUrl } } = sb.storage.from('drive').getPublicUrl(`${folderLocation}/${item.name}`);
                            files.push({ name: item.name, displayName: item.name.replace(/^[0-9]+_/, ''), path: `${folderLocation}/${item.name}`, type, url: publicUrl, source: 'supabase' });
                        }
                    });
                }
            } catch(e) {}

            // GitHub রিলিজ ফাইল
            try {
                const ghRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${RELEASE_TAG}`, {
                    headers: { 'Authorization': `Bearer ${VAULT_STORAGE_TOKEN}` }
                });
                if (ghRes.ok) {
                    const ghData = await ghRes.json();
                    const assets = ghData.assets || [];

                    assets.forEach(asset => {
                        if (!asset.name.startsWith(userPrefix)) return;

                        if (path === '') {
                            const rest = asset.name.substring(userPrefix.length);
                            if (rest.includes('__')) {
                                const fName = rest.split('__')[0];
                                if (!folders.some(f => f.name === fName)) {
                                    folders.push({ name: fName, path: fName, fullPath: fName });
                                }
                            } else {
                                files.push(makeGhFileObj(asset, rest));
                            }
                        } else {
                            if (asset.name.startsWith(folderPrefix)) {
                                const rest = asset.name.substring(folderPrefix.length);
                                if (rest.includes('__')) {
                                    const fName = rest.split('__')[0];
                                    const subRel = `${path}/${fName}`;
                                    if (!folders.some(f => f.name === fName)) {
                                        folders.push({ name: fName, path: subRel, fullPath: subRel });
                                    }
                                } else {
                                    files.push(makeGhFileObj(asset, rest));
                                }
                            }
                        }
                    });
                }
            } catch(e) {}

            // ফোল্ডার রেন্ডার
            const folderSec = document.getElementById('folderSec');
            const foldersGrid = document.getElementById('foldersGrid');
            foldersGrid.innerHTML = '';
            if (folders.length > 0) {
                folderSec.classList.remove('hidden');
                folders.forEach(f => {
                    const node = document.createElement('div');
                    node.className = 'folder-node';
                    node.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px; overflow:hidden; flex:1;" onclick="navigateTo('${f.path}')">
                            <span style="color:var(--neon-cyan)">📁</span>
                            <span style="font-size:12px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${f.name}</span>
                        </div>
                        <button class="btn-menu-dot" onclick="event.stopPropagation(); openActionModal('folder', '${f.name}', '${f.fullPath}')">⋮</button>
                    `;
                    foldersGrid.appendChild(node);
                });
            } else {
                folderSec.classList.add('hidden');
            }

            // ফাইল রেন্ডার
            const filesGrid = document.getElementById('filesGrid');
            filesGrid.innerHTML = '';
            if (files.length > 0) {
                files.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'cyber-card';

                    let mediaHtml = '<div style="font-size:36px;">📄</div>';
                    if (f.type === 'image') mediaHtml = `<img src="${f.url}" loading="lazy">`;
                    if (f.type === 'video') mediaHtml = `<video src="${f.url}#t=0.5"></video><div class="play-indicator">▶</div>`;

                    card.innerHTML = `
                        <div class="card-preview" onclick="openPreview('${f.url}', '${f.type}')">${mediaHtml}</div>
                        <div class="card-footer">
                            <div class="file-title" title="${f.displayName}">${f.displayName}</div>
                            <button class="btn-menu-dot" onclick="event.stopPropagation(); openActionModal('file', '${f.displayName}', '${f.path}', '${f.url}', '${f.source}', '${f.ghAssetId || ''}')">⋮</button>
                        </div>
                    `;
                    filesGrid.appendChild(card);
                });
            } else {
                filesGrid.innerHTML = '<p style="color:#64748b; font-size:12px; grid-column: 1/-1; text-align:center; padding:30px 0;">কোনো ফাইল আপলোড করা নেই।</p>';
            }
        }

        function makeGhFileObj(asset, rawName) {
            const ext = asset.name.split('.').pop().toLowerCase();
            let type = 'other';
            if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) type = 'image';
            if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) type = 'video';
            const cleanDisplay = rawName.replace(/^[0-9]+_/, '');
            return {
                name: asset.name,
                displayName: cleanDisplay,
                path: asset.name,
                url: asset.browser_download_url,
                type,
                source: 'github',
                ghAssetId: asset.id
            };
        }

        function renderBreadcrumb(path) {
            const nav = document.getElementById('breadcrumbNav');
            nav.innerHTML = '<span onclick="navigateTo(\'\')">🏠 MY_VAULT</span>';
            if (!path) return;

            const parts = path.split('/');
            let accum = '';
            parts.forEach((p, idx) => {
                accum += (idx === 0 ? '' : '/') + p;
                const isLast = idx === parts.length - 1;
                const currentAccum = accum;
                nav.innerHTML += ` <span style="color:#475569">/</span> <span class="${isLast ? 'active-path' : ''}" onclick="navigateTo('${currentAccum}')">${p}</span>`;
            });
        }

        async function promptNewFolder() {
            const name = prompt('নতুন ফোল্ডারের নাম দিন:');
            if (!name) return;
            const clean = name.trim().replace(/[^a-zA-Z0-9 _-]/g, '');
            const placeholderPath = `${getFolderPath(currentPath)}/${clean}/.keep`;

            const { error } = await sb.storage.from('drive').upload(placeholderPath, new Blob(['']), { upsert: true });
            if (error) alert('ফোল্ডার তৈরি ব্যর্থ হয়েছে: ' + error.message);
            else loadContent(currentPath);
        }

        // অটোমেটিক আপলোড ইঞ্জিন
        async function unifiedUpload(input) {
            if (!input.files.length) return;

            const progressBox = document.getElementById('progressBox');
            const progressFileText = document.getElementById('progressFileText');
            const progressPercent = document.getElementById('progressPercent');
            const progressFill = document.getElementById('progressFill');

            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                const isLarge = file.size > 50 * 1024 * 1024;

                progressBox.classList.remove('hidden');
                progressFileText.textContent = `> আপলোড হচ্ছে: ${file.name}`;
                progressPercent.textContent = '0%';
                progressFill.style.width = '0%';

                if (isLarge) {
                    // বড় ফাইল হলে ব্যাকগ্রাউন্ডে ২ জিবি ইঞ্জিনে যাবে
                    try {
                        const releaseId = await getOrCreateReleaseId();
                        const uname = currentUser.user_metadata?.username || currentUser.id;
                        const prefix = currentPath ? `${uname}__${currentPath.replace(/\//g, '__')}__` : `${uname}__`;
                        const cleanName = `${prefix}${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;

                        await uploadToGitHub(file, cleanName, releaseId, (percent) => {
                            progressPercent.textContent = `${percent}%`;
                            progressFill.style.width = `${percent}%`;
                        });
                    } catch (err) {
                        alert('আপলোডে সমস্যা হয়েছে: ' + err.message);
                    }
                } else {
                    // সাধারণ ফাইল
                    const folderLocation = getFolderPath(currentPath);
                    const cleanName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
                    const uploadPath = `${folderLocation}/${cleanName}`;

                    try {
                        await uploadWithProgress(file, uploadPath, (percent) => {
                            progressPercent.textContent = `${percent}%`;
                            progressFill.style.width = `${percent}%`;
                        });
                    } catch (err) {
                        const { error: fbErr } = await sb.storage.from('drive').upload(uploadPath, file, { upsert: true });
                        if (fbErr) alert('আপলোডে সমস্যা: ' + fbErr.message);
                    }
                }
            }

            progressPercent.textContent = '100%';
            progressFill.style.width = '100%';
            progressFileText.textContent = '> [UPLOAD COMPLETE 100%]';
            
            setTimeout(() => {
                progressBox.classList.add('hidden');
            }, 1000);

            input.value = '';
            loadContent(currentPath);
        }

        function uploadWithProgress(file, uploadPath, onProgress) {
            return new Promise(async (resolve, reject) => {
                const { data: { session } } = await sb.auth.getSession();
                const token = session ? session.access_token : SUPABASE_KEY;
                const url = `${SUPABASE_URL}/storage/v1/object/drive/${encodeURI(uploadPath)}`;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', url);
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                xhr.setRequestHeader('apikey', SUPABASE_KEY);
                xhr.setRequestHeader('x-upsert', 'true');
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        onProgress(percent);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) resolve();
                    else reject(new Error(`Status ${xhr.status}`));
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(file);
            });
        }

        async function getOrCreateReleaseId() {
            if (cachedReleaseId) return cachedReleaseId;
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${RELEASE_TAG}`, {
                    headers: { 'Authorization': `Bearer ${VAULT_STORAGE_TOKEN}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    cachedReleaseId = data.id;
                    return cachedReleaseId;
                }
                const createRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${VAULT_STORAGE_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag_name: RELEASE_TAG, name: 'PRINCE VAULT', draft: false, prerelease: false })
                });
                const createData = await createRes.json();
                cachedReleaseId = createData.id;
                return cachedReleaseId;
            } catch(e) { return null; }
        }

        function uploadToGitHub(file, filename, releaseId, onProgress) {
            return new Promise((resolve, reject) => {
                const encodedName = encodeURIComponent(filename);
                const url = `https://uploads.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/${releaseId}/assets?name=${encodedName}`;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', url);
                xhr.setRequestHeader('Authorization', `Bearer ${VAULT_STORAGE_TOKEN}`);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        onProgress(percent);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) resolve();
                    else reject(new Error(`Upload error ${xhr.status}`));
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(file);
            });
        }

        // ৩-ডট একশন মেনু
        function openActionModal(type, name, path, url = '', source = 'supabase', ghAssetId = '') {
            activeItem = { type, name, path, url, source, ghAssetId };
            const cleanTitle = name.replace(/^[0-9]+_/, '');
            document.getElementById('actionTargetTitle').textContent = `// ${cleanTitle}`;
            
            const dlBtn = document.getElementById('actionDownloadBtn');
            if (type === 'file') {
                dlBtn.classList.remove('hidden');
                dlBtn.href = url;
            } else {
                dlBtn.classList.add('hidden');
            }
            document.getElementById('actionModal').classList.remove('hidden');
            history.pushState({ modalOpen: true }, '');
        }

        function closeActionModal() {
            const modal = document.getElementById('actionModal');
            if (!modal.classList.contains('hidden')) {
                modal.classList.add('hidden');
                activeItem = null;
            }
        }

        async function executeRename() {
            if (!activeItem) return;
            const newNameInput = prompt('নতুন নাম দিন:', activeItem.name.replace(/^[0-9]+_/, ''));
            if (!newNameInput) return;

            if (activeItem.source === 'github') {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/assets/${activeItem.ghAssetId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${VAULT_STORAGE_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: `${Date.now()}_${newNameInput.trim()}` })
                });
                if (res.ok) { closeActionModal(); loadContent(currentPath); }
            } else {
                if (activeItem.type === 'file') {
                    const pathParts = activeItem.path.split('/');
                    pathParts.pop();
                    const newPath = [...pathParts, `${Date.now()}_${newNameInput.trim()}`].join('/');
                    await sb.storage.from('drive').move(activeItem.path, newPath);
                    closeActionModal();
                    loadContent(currentPath);
                }
            }
        }

        async function executeDelete() {
            if (!activeItem || !confirm('মুছে ফেলতে চান?')) return;

            if (activeItem.source === 'github') {
                await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/assets/${activeItem.ghAssetId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${VAULT_STORAGE_TOKEN}` }
                });
            } else {
                if (activeItem.type === 'file') {
                    await sb.storage.from('drive').remove([activeItem.path]);
                } else {
                    const { data: folderItems } = await sb.storage.from('drive').list(activeItem.path);
                    if (folderItems && folderItems.length > 0) {
                        const toDelete = folderItems.map(f => `${activeItem.path}/${f.name}`);
                        await sb.storage.from('drive').remove(toDelete);
                    }
                    await sb.storage.from('drive').remove([`${activeItem.path}/.keep`]);
                }
            }
            closeActionModal();
            loadContent(currentPath);
        }

        // প্রোফাইল সেটিংস
        function openSettingsModal() {
            document.getElementById('settingsStatusMsg').textContent = '';
            document.getElementById('settingsModal').classList.remove('hidden');
            history.pushState({ modalOpen: true }, '');
        }
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        async function uploadNewAvatar(input) {
            if (!input.files.length) return;
            const file = input.files[0];
            const msg = document.getElementById('settingsStatusMsg');
            msg.style.color = 'var(--neon-green)';
            msg.textContent = 'ছবি সেভ হচ্ছে...';

            const avatarPath = `${currentUser.id}/system/avatar_${Date.now()}.jpg`;
            await sb.storage.from('drive').upload(avatarPath, file, { upsert: true });

            const { data: { publicUrl } } = sb.storage.from('drive').getPublicUrl(avatarPath);
            await sb.auth.updateUser({ data: { avatar_url: publicUrl } });
            currentUser.user_metadata.avatar_url = publicUrl;

            document.getElementById('userAvatar').src = publicUrl;
            document.getElementById('settingsAvatarPreview').src = publicUrl;
            msg.textContent = 'প্রোফাইল ছবি সফলভাবে আপডেট হয়েছে!';
        }

        async function updateUsername() {
            const newUname = document.getElementById('newUsernameInput').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const msg = document.getElementById('settingsStatusMsg');
            if (!newUname) return;

            const { error } = await sb.auth.updateUser({ data: { username: newUname } });
            if (!error) {
                currentUser.user_metadata.username = newUname;
                document.getElementById('hudUser').textContent = `[AGENT: ${newUname.toUpperCase()}]`;
                msg.textContent = 'ইউজারনেম সফলভাবে পরিবর্তন হয়েছে!';
            }
        }

        async function updatePassword() {
            const newPass = document.getElementById('newPasswordInput').value;
            const msg = document.getElementById('settingsStatusMsg');
            if (newPass.length < 6) {
                msg.style.color = 'var(--neon-pink)';
                msg.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!';
                return;
            }

            const { error } = await sb.auth.updateUser({ password: newPass });
            if (!error) {
                document.getElementById('newPasswordInput').value = '';
                msg.textContent = 'পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে!';
            }
        }

        function openPreview(url, type) {
            const modal = document.getElementById('previewModal');
            const target = document.getElementById('modalTarget');
            target.innerHTML = '';
            if (type === 'image') target.innerHTML = `<img src="${url}">`;
            else if (type === 'video') target.innerHTML = `<video src="${url}" controls autoplay></video>`;
            else { window.open(url, '_blank'); return; }
            modal.classList.remove('hidden');
            history.pushState({ modalOpen: true }, '');
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            modal.classList.add('hidden');
            document.getElementById('modalTarget').innerHTML = '';
        }

        async function logout() {
            await sb.auth.signOut();
            location.reload();
        }
    </script>
